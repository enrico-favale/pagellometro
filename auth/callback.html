<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Completamento accesso</title>
    <script>
      // Lascia che Supabase processi il token dall'URL,
      // poi reindirizza direttamente alla dashboard.
      // Supabase legge i parametri dal fragment (#access_token=...)
      // e aggiorna localStorage, quindi il prossimo caricamento
      // vede già l'utente loggato.
      window.location.replace('/pagellometro/dashboard')
    </script>
  </head>
  <body>
    <p>Completamento accesso in corso...</p>
  </body>
</html>
